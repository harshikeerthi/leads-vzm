<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vizag IVF Centre | Vizianagaram - సంతాన సాఫల్య కేంద్రం</title>
    <meta name="description" content="Vizag IVF - Best Fertility Clinic in Vizianagaram, Vizag IVF Centre, 100 Ft Ring Rd, beside Sonovision, Ice Factory Area, Sai Nath Colony, Vizianagaram, Andhra Pradesh 535002. 8,000+ Happy Families. Call +91 94949 86611." />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:ital,wght@0,600;0,700;0,800;1,600;1,700;1,800&display=swap" rel="stylesheet">
    <script>
      window.addEventListener('load', function() {
        // Track Page Visit
        fetch('https://adinsights.medcytech.com/api/track-click', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ elementClicked: 'Page Visit: Consultation Medcy IVF' }),
        }).catch(err => console.error(err));
    
        // Track Link Clicks
        document.querySelectorAll('a').forEach(link => {
          link.addEventListener('click', function() {
            const linkText = this.innerText.trim() || 'Icon/Image Link';
            fetch('https://adinsights.medcytech.com/api/track-click', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ elementClicked: `[Consultation Medcy IVF] Clicked: ${linkText}` }),
            }).catch(err => console.error(err));
          });
        });
      });
    </script>
  </head>
  <body class="bg-[#FAF6FA] text-[#2A102D] antialiased selection:bg-[#652D6C] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
